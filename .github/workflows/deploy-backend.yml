name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Deployment Secrets
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          MISSING=0
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Secret VPS_HOST is missing or empty. Configure VPS_HOST in GitHub repository secrets."
            MISSING=1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Secret VPS_USER is missing or empty. Configure VPS_USER in GitHub repository secrets."
            MISSING=1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is missing or empty. Configure VPS_SSH_KEY in GitHub repository secrets."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Deployment preflight validation failed: one or more required secrets are missing."
            exit 1
          fi
          echo "All required deployment secrets are configured."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /var/www/ilovesurprises-backend

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/master

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Building application..."
            npm run build

            echo "Reloading PM2..."
            pm2 reload ecosystem.config.js --update-env

            echo "Deployment complete!"
            pm2 status
