name: Deploy Frontend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST

    steps:
      - name: Validate Deployment Secrets
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          MISSING=0
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Secret VPS_HOST is missing or empty."
            MISSING=1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Secret VPS_USER is missing or empty."
            MISSING=1
          fi
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            echo "::error::Neither VPS_SSH_KEY nor VPS_PASSWORD is configured. Provide at least one."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Deployment preflight validation failed."
            exit 1
          fi
          echo "All required deployment credentials are configured."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /var/www/ilovesurprises-frontend

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/master

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment complete!"
